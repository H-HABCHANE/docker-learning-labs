services:
  db:
    image: redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - donnees:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 2s
      timeout: 2s
      retries: 5

  web:
    build: .
    image: hhabchane/compteur-web:v2
    ports:
      - "8080:5000"
    environment:
      REDIS_HOST: db
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NOM_APP: Super compteur
    depends_on:
      db:
        condition: service_healthy

volumes:
  donnees:
